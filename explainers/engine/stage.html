<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b1319;--panel:#13212b;--panel2:#18303c;--ink:#eef4f7;--muted:#8ea3b1;--line:#2c4351;
--teal:#3fd0dc;--green:#4fd18b;--amber:#ffb347;--red:#ff6b5e;--violet:#a98bff;--blue:#6aa8ff;--pink:#ff8fc8;
--display:"Archivo","Arial Narrow",sans-serif;--body:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:var(--body);color:var(--ink)}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 800px at 25% 20%,#16323d 0%,#0b1319 65%)}
.scene{position:absolute;inset:0;display:none}
.scene > *{position:absolute}
[data-cue]{opacity:0}
#caption{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);max-width:1640px;padding:12px 28px;border-radius:16px;background:rgba(5,10,14,.9);color:#f1f5f8;font:500 31px/1.32 var(--body);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);border:1px solid #233743;z-index:50}
#chapter{position:absolute;left:44px;top:30px;display:flex;gap:14px;align-items:center;padding:9px 20px 9px 12px;border-radius:999px;background:rgba(5,10,14,.85);color:#e8eef2;font:600 21px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid #233743;z-index:50}
#chapter b{background:var(--teal);color:#06141a;border-radius:999px;padding:3px 11px;font-weight:700}
#brand{position:absolute;right:44px;top:38px;font:600 20px var(--mono);color:var(--muted);letter-spacing:.08em;z-index:50}
#prog{position:absolute;left:0;bottom:0;height:5px;background:var(--teal);opacity:.7;z-index:50}
/* kit */
.box{border-radius:16px;background:var(--panel);border:2px solid var(--line);padding:16px 22px}
.box .t{font:700 32px var(--body)} .box .s{font:500 22px var(--mono);color:var(--muted);margin-top:4px}
.box.teal{border-color:var(--teal)} .box.amber{border-color:var(--amber)} .box.green{border-color:var(--green)} .box.red{border-color:var(--red)} .box.violet{border-color:var(--violet)} .box.blue{border-color:var(--blue)} .box.pink{border-color:var(--pink)}
.h1{font:800 150px/0.95 var(--display);font-stretch:72%}
.h2{font:800 64px/1 var(--display);font-stretch:80%;letter-spacing:-.005em}
.h3{font:700 40px/1.15 var(--body)}
.eyebrow{font:600 28px var(--mono);letter-spacing:.18em;color:var(--teal);text-transform:uppercase}
.sub{font:400 38px/1.3 var(--body);color:#b7c7d2}
.body{font:400 30px/1.4 var(--body);color:#d4e0e7}
.lbl{font:600 22px var(--mono);color:var(--muted);letter-spacing:.04em}
.mono{font-family:var(--mono)}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font:600 22px var(--mono);background:var(--panel2);border:1px solid var(--line)}
.code{font:500 27px/1.5 var(--mono);color:#dce8ee;white-space:pre;background:#08121a;border:2px solid var(--line);border-radius:14px;padding:20px 26px}
.code .k{color:var(--teal)} .code .c{color:#6f8796} .code .r{color:var(--amber)} .code .g{color:var(--green)} .code .v{color:var(--violet)} .code .x{color:var(--red)}
.code .line{display:block;margin:0 -26px;padding:0 26px} .code .line.hl{background:rgba(63,208,220,.16);box-shadow:inset 4px 0 0 var(--teal)}
.cell{position:absolute;height:64px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font:600 20px var(--mono);color:#06141a;text-align:center;line-height:1.1}
.bytes{display:flex;gap:0} .bytes > div{height:70px;border:1px solid rgba(0,0,0,.35);display:grid;place-items:center;font:600 19px var(--mono);color:#06141a;text-align:center;line-height:1.1;padding:0 4px;overflow:hidden}
table.t{border-collapse:collapse;font:500 25px var(--mono)} table.t td,table.t th{padding:10px 18px;border-bottom:1px solid var(--line);text-align:left} table.t th{color:var(--muted);font-weight:600;font-size:21px}
.pkt{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--teal);margin:-11px 0 0 -11px;box-shadow:0 0 14px var(--teal)}
.tag{position:absolute;padding:4px 12px;border-radius:8px;font:600 21px var(--mono);background:#08121a;border:1px solid var(--line)}
.hl{box-shadow:0 0 0 3px var(--amber),0 0 34px rgba(255,179,71,.45)!important}
.dim{opacity:.35!important}
.bar{position:absolute;height:40px;border-radius:6px}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
.c-teal{color:var(--teal)} .c-amber{color:var(--amber)} .c-green{color:var(--green)} .c-red{color:var(--red)} .c-violet{color:var(--violet)} .c-blue{color:var(--blue)} .c-pink{color:var(--pink)} .c-muted{color:var(--muted)}
</style>
<style id="video-css"></style>
</head>
<body>
<div id="bg"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea3b1"/></marker>
<marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd0dc"/></marker>
<marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb347"/></marker>
<marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fd18b"/></marker>
<marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b5e"/></marker>
<marker id="ah-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a98bff"/></marker>
</defs></svg>
<div id="scenes"></div>
<div id="chapter" style="display:none"><b id="ch-n">1</b><span id="ch-t"></span></div>
<div id="brand"></div>
<div id="caption" style="display:none"></div>
<div id="prog"></div>
<script src="engine.js"></script>
</body></html>
