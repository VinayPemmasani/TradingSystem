<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packet Life 3D</title>
<style>
  :root {
    --bg: #0a0e13; --panel: rgba(15, 20, 28, 0.9); --line: #243041; --text: #dbe3ec;
    --muted: #8a99ab; --accent: #5ab0ff; --code: #0d131b;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f8; --panel: rgba(255, 255, 255, 0.93); --line: #d4dbe4; --text: #18212d;
    --muted: #5b6a7c; --code: #f0f3f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); }
  #story { top: 12px; right: 12px; width: 400px; max-height: calc(100% - 92px); overflow: auto; padding: 14px 16px; }
  #story .where { color: var(--muted); font-size: 12px; }
  #story h1 { font-size: 16px; margin: 2px 0 6px; }
  #story p { margin: 0 0 10px; }
  h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 2px 4px; vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; color: var(--muted); }
  .tbar { height: 6px; border-radius: 3px; background: var(--accent); opacity: .75; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .msg.live { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .msg .name { font-weight: 600; }
  .msg .meta { color: var(--muted); font-size: 12px; }
  .bytes { font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code);
    border-radius: 6px; padding: 6px 8px; margin: 6px 0; word-break: break-all; }
  .bytes span { border-radius: 2px; padding: 0 1px; }
  .fields td { font-size: 12px; border-top: 1px solid var(--line); }
  .fields td.v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #legend { top: 12px; left: 12px; padding: 10px 12px; max-width: 300px; }
  #legend .title { font-weight: 600; font-size: 14px; }
  #legend .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #legend div.g { font-size: 12px; }
  #clock { margin-top: 8px; font-variant-numeric: tabular-nums; font-size: 12px; }
  #clock b { font-size: 15px; }
  #controls { left: 12px; right: 12px; bottom: 12px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #track { position: relative; flex: 1 1 260px; height: 26px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
  #track .fill { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--accent); }
  #track .tick { position: absolute; top: 4px; width: 2px; height: 18px; background: var(--muted); opacity: .5; }
  #track .tick span { position: absolute; top: -2px; left: 4px; font-size: 10px; color: var(--muted); white-space: nowrap; }
  button, select { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .lbl { font-size: 11px; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .lbl.grp { font-weight: 700; font-size: 12px; border: none; background: none; text-shadow: 0 1px 3px var(--bg); }
  .tag { font-size: 10px; color: #fff; background: rgba(20, 30, 45, .8); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
  @media (max-width: 820px) {
    #story { left: 12px; right: 12px; width: auto; top: auto; bottom: 74px; max-height: 42%; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="legend" class="panel">
  <div class="title">One order's packet life</div>
  <div class="sub">Every message the lab's own code produces, from the exchange's feed to the fill. Data: <code>tools/order-trace</code>.</div>
  <div id="groups"></div>
  <div id="clock"></div>
</div>
<div id="story" class="panel"></div>
<div id="controls" class="panel">
  <button id="prev" title="Previous stage (←)">◀</button>
  <button id="play" title="Play or pause (space)">Pause</button>
  <button id="next" title="Next stage (→)">▶</button>
  <select id="speed" title="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
  <div id="track"><div class="rail"></div><div class="fill"></div></div>
  <button id="follow" title="Camera follows the packet (F)">Follow</button>
</div>

<!-- viz/packet-life/build_page.py fills these in; when empty the page fetches the files beside it -->
<script id="trace-data" type="application/json">/*TRACE_JSON*/</script>
<script id="scene-data" type="application/json">/*SCENE_JSON*/</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---- Timeline rules, shared with opengl/main.cpp (keep the two in step) -------------------
const TRAVEL = 10;       // scene units per second at 1x
const MIN_LEG = 1.4;     // seconds for a leg that stays at one station (a decision)
const WAVE_GAP = 0.5;    // pause after each wave
const STAGE_GAP = 1.8;   // pause after each stage, to read the panel
const FIELD_COLORS = ['#ff6b6b', '#ffd166', '#06d6a0', '#4cc9f0', '#b388ff', '#f78c6b', '#9ef01a', '#f15bb5'];
const HEADER_COLOR = '#7f8ea3';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Framing fields (Soup, MoldUDP64 and FIX header/trailer tags) are grey; payload fields take
// the palette in order. opengl/main.cpp uses the same rule.
const isHeader = (n) => /^(Soup|Message Type|Message Length)/.test(n) || ['Session', 'Sequence Number', 'Message Count', '8', '9', '10'].includes(n);
const fieldColor = (i, name) => isHeader(name) ? HEADER_COLOR : FIELD_COLORS[i % FIELD_COLORS.length];

if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
const dark = document.documentElement.dataset.theme !== 'light';

// ---- Timeline ------------------------------------------------------------------------------
function buildTimeline(trace, scene) {
  const stages = trace.stages;
  const st = Object.fromEntries(scene.stations.map((s) => [s.id, s]));
  const pos = (id) => new THREE.Vector3(st[id].x, 0, st[id].z);
  const legs = scene.legs.map((l) => {
    const stage = stages.findIndex((s) => s.id === l.stage);
    const src = stages.find((s) => s.id === (l.from || l.stage));
    const msg = l.msg >= 0 && src ? src.msgs[l.msg] : null;
    const pts = l.path.map(pos);
    let len = 0; for (let i = 1; i < pts.length; i++) len += pts[i].distanceTo(pts[i - 1]);
    return { ...l, stageIdx: stage, msgObj: msg, pts, len, dur: pts.length > 1 ? Math.max(0.6, len / TRAVEL) : MIN_LEG };
  }).filter((l) => l.stageIdx >= 0);
  // Waves in order, stages in order.
  const waves = [];
  let t = 0;
  const stageStart = [];
  stages.forEach((s, si) => {
    stageStart[si] = t;
    const ls = legs.filter((l) => l.stageIdx === si);
    const ids = [...new Set(ls.map((l) => l.wave))].sort((a, b) => a - b);
    for (const w of ids) {
      const wl = ls.filter((l) => l.wave === w);
      const dur = Math.max(...wl.map((l) => l.dur));
      wl.forEach((l) => { l.t0 = t; });
      waves.push({ si, t0: t, t1: t + dur, legs: wl });
      t += dur + WAVE_GAP;
    }
    t += STAGE_GAP;
  });
  return { stages, legs, waves, stageStart, total: t, st };
}

function pointAt(pts, len, p) {
  if (pts.length === 1) return pts[0].clone();
  let d = p * len;
  for (let i = 1; i < pts.length; i++) {
    const seg = pts[i].distanceTo(pts[i - 1]);
    if (d <= seg || i === pts.length - 1) return pts[i - 1].clone().lerp(pts[i], Math.min(1, d / seg));
    d -= seg;
  }
  return pts[pts.length - 1].clone();
}

// ---- Three.js scene ------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('view').appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
$('view').appendChild(labels.domElement);

const scene3 = new THREE.Scene();
scene3.background = new THREE.Color(dark ? 0x0a0e13 : 0xf3f5f8);
scene3.fog = new THREE.Fog(scene3.background, 70, 140);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const HOME = new THREE.Vector3(-8, 46, 54), HOME_TARGET = new THREE.Vector3(-3, 0, 5);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
scene3.add(new THREE.HemisphereLight(0xe6eeff, 0x1a2230, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-20, 50, 30); scene3.add(sun);

const tag = (text, cls, pos) => {
  const el = document.createElement('div'); el.className = cls; el.textContent = text;
  const o = new CSS2DObject(el); o.position.copy(pos); return o;
};

let TL = null, packets = [], stationMeshes = {}, playing = true, speed = 1, T = 0, follow = false, shownStage = -1, liveKey = '';

function build(trace, scene) {
  TL = buildTimeline(trace, scene);
  const groups = Object.fromEntries(scene.groups.map((g) => [g.id, g]));
  $('groups').innerHTML = scene.groups.map((g) => `<div class="g"><i class="sw" style="background:${g.color}"></i>${esc(g.label)}</div>`).join('');

  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 70), new THREE.MeshStandardMaterial({ color: dark ? 0x0f151d : 0xe7ecf2, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(-3, -0.02, 5); scene3.add(floor);
  const grid = new THREE.GridHelper(90, 45, dark ? 0x1b2532 : 0xd2dae4, dark ? 0x141c26 : 0xdde3ea);
  grid.position.set(-3, 0, 5); scene3.add(grid);

  // Group pads: a slab under each process's stations.
  for (const g of scene.groups) {
    const ss = scene.stations.filter((s) => s.group === g.id);
    const xs = ss.map((s) => s.x), zs = ss.map((s) => s.z);
    const [x0, x1, z0, z1] = [Math.min(...xs) - 3.5, Math.max(...xs) + 3.5, Math.min(...zs) - 3.5, Math.max(...zs) + 3.5];
    const pad = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.3, z1 - z0),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(g.color), transparent: true, opacity: 0.16, roughness: 1 }));
    pad.position.set((x0 + x1) / 2, 0.15, (z0 + z1) / 2); scene3.add(pad);
    scene3.add(tag(g.label, 'lbl grp', new THREE.Vector3((x0 + x1) / 2, 0.4, z1 + 0.9)));
  }

  // Stations: a block per thread or device, a label above.
  for (const s of scene.stations) {
    const g = groups[s.group];
    const isNet = s.group === 'net';
    const geo = isNet ? new THREE.CylinderGeometry(1.6, 1.6, 1.2, 6) : new THREE.BoxGeometry(3.2, 1.6, 3.2);
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(g.color), roughness: 0.45, metalness: 0.1, emissive: new THREE.Color(g.color), emissiveIntensity: 0 });
    const m = new THREE.Mesh(geo, mat); m.position.set(s.x, isNet ? 0.9 : 1.1, s.z);
    scene3.add(m); stationMeshes[s.id] = m;
    scene3.add(tag(s.label, 'lbl', new THREE.Vector3(s.x, 2.6, s.z)));
  }

  // Links: every hop any leg uses, drawn once, as a thin tube.
  const seen = new Set();
  for (const l of TL.legs) for (let i = 1; i < l.path.length; i++) {
    const k = [l.path[i - 1], l.path[i]].sort().join('|');
    if (seen.has(k)) continue; seen.add(k);
    const a = l.pts[i - 1].clone().setY(0.5), b = l.pts[i].clone().setY(0.5);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, 0.12, 6),
      new THREE.MeshStandardMaterial({ color: dark ? 0x3a4a5e : 0xa9b6c6, roughness: 0.8 }));
    scene3.add(tube);
  }

  // Track ticks per stage.
  const track = $('track');
  TL.stages.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'tick';
    d.style.left = (100 * TL.stageStart[i] / TL.total) + '%';
    d.innerHTML = `<span>${i + 1}</span>`; d.title = s.title; track.appendChild(d);
  });
}

// A packet: one box per field, laid along x and sized by the field's bytes, so a 172-byte
// MoldUDP64 packet is visibly longer than a 31-byte ITCH Order Executed.
function makePacket(leg) {
  const g = new THREE.Group();
  const m = leg.msgObj;
  if (!m) {
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x88aaff, emissiveIntensity: 0.6 }));
    g.add(orb);
    if (leg.label) g.add(tag(leg.label, 'tag', new THREE.Vector3(0, 1.4, 0)));
    return g;
  }
  const size = Math.max(1, m.size);
  const length = 2 + 6 * Math.sqrt(size / 172);
  let x = -length / 2;
  m.fields.forEach(([, len, name], i) => {
    const w = Math.max(0.04, (len / size) * length);
    const c = new THREE.Color(fieldColor(i, name));
    const box = new THREE.Mesh(new THREE.BoxGeometry(w * 0.94, 1.1, 1.4), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.35, roughness: 0.4 }));
    box.position.x = x + w / 2; g.add(box); x += w;
  });
  g.add(tag(`${m.name.replace(/ \(.*\)$/, '')} · ${m.size} B`, 'tag', new THREE.Vector3(0, 1.6, 0)));
  return g;
}

function clearPackets() { for (const p of packets) { scene3.remove(p.g); p.g.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); if (o.isCSS2DObject) o.element.remove(); }); } packets = []; }

// ---- Panel ---------------------------------------------------------------------------------
function fmtNs(ns) { return ns >= 1000 ? (ns / 1000).toFixed(2) + ' µs' : ns.toFixed(1) + ' ns'; }

function renderMsg(m, live) {
  const fields = m.fields.map(([off, len, name, value], i) => ({ off, len, name, value, c: fieldColor(i, name) }));
  let bytes = '';
  if (m.hex) {
    bytes = fields.map((f) => `<span style="background:${f.c}33;box-shadow:inset 0 -2px ${f.c}">${m.hex.slice(f.off * 2, (f.off + f.len) * 2).replace(/(..)/g, '$1 ').trim()}</span>`).join(' ');
  } else if (m.text) {
    bytes = fields.map((f) => `<span style="background:${f.c}33;box-shadow:inset 0 -2px ${f.c}">${esc(m.text.slice(f.off, f.off + f.len))}</span>`).join('');
  }
  return `<div class="msg ${live ? 'live' : ''}">
    <div class="name">${esc(m.name)}</div>
    <div class="meta">${esc(m.proto)} · ${m.size} bytes · ${esc(m.link || '')}</div>
    ${bytes ? `<div class="bytes">${bytes}</div>` : ''}
    ${m.note ? `<div class="meta">${esc(m.note)}</div>` : ''}
    ${live ? `<table class="fields">${fields.map((f) => `<tr><td><i class="sw" style="background:${f.c}"></i>${esc(f.name)}</td><td class="n">${f.off}+${f.len}</td><td class="v">${esc(f.value)}</td></tr>`).join('')}</table>` : ''}
  </div>`;
}

function renderStage(si, liveMsgs) {
  const s = TL.stages[si];
  const timing = Object.entries(s.timing || {});
  const maxP99 = Math.max(1, ...timing.map(([, [, p99]]) => p99));
  $('story').innerHTML = `
    <div class="where">Stage ${si + 1} of ${TL.stages.length} · ${esc(s.where)}</div>
    <h1>${esc(s.title)}</h1>
    <p>${esc(s.body)}</p>
    ${timing.length ? `<h2>Measured on this machine (p50 / p99)</h2><table>${timing.map(([k, [p50, p99]]) => `<tr><td>${esc(k)}</td><td class="n">${fmtNs(p50)}</td><td class="n">${fmtNs(p99)}</td></tr><tr><td colspan="3"><div class="tbar" style="width:${(100 * p50 / maxP99).toFixed(1)}%"></div></td></tr>`).join('')}</table>` : ''}
    ${s.msgs.length ? `<h2>Messages</h2>${s.msgs.map((m) => renderMsg(m, liveMsgs.includes(m))).join('')}` : ''}`;
}

// Running total of in-process p50 cost so far: the lab's own share of tick-to-trade.
function renderClock(si) {
  let sum = 0;
  for (let i = 0; i <= si; i++) for (const [, [p50]] of Object.entries(TL.stages[i].timing || {})) sum += p50;
  $('clock').innerHTML = `In-process work so far (p50 sum)<br><b>${fmtNs(sum)}</b> over ${si + 1} stage${si ? 's' : ''}`;
}

// ---- Frame update --------------------------------------------------------------------------
function update() {
  // Current wave: the last one started.
  let wi = -1;
  for (let i = 0; i < TL.waves.length; i++) if (TL.waves[i].t0 <= T) wi = i;
  const si = wi >= 0 ? TL.waves[wi].si : 0;
  const w = TL.waves[wi];
  const key = wi + '';
  if (key !== liveKey) {
    liveKey = key; clearPackets();
    if (w) for (const l of w.legs) { const g = makePacket(l); scene3.add(g); packets.push({ g, l }); }
  }
  for (const p of packets) {
    const prog = Math.min(1, (T - p.l.t0) / p.l.dur);
    const at = pointAt(p.l.pts, p.l.len, prog);
    p.g.position.set(at.x, 3.4 + 0.25 * Math.sin(T * 6), at.z);
    // Face the direction of travel.
    const ahead = pointAt(p.l.pts, p.l.len, Math.min(1, prog + 0.02));
    if (ahead.distanceToSquared(at) > 1e-6) p.g.rotation.y = Math.atan2(-(ahead.z - at.z), ahead.x - at.x);
    else if (!p.l.msgObj) p.g.rotation.y += 0.03;
  }
  // Stations glow while a packet is on them.
  for (const [id, m] of Object.entries(stationMeshes)) {
    let glow = 0;
    for (const p of packets) for (const pt of p.l.pts) {
      const d = Math.hypot(p.g.position.x - pt.x, p.g.position.z - pt.z);
      if (d < 3 && TL.st[id].x === pt.x && TL.st[id].z === pt.z) glow = Math.max(glow, 1 - d / 3);
    }
    m.material.emissiveIntensity = 0.6 * glow;
  }
  const liveMsgs = packets.map((p) => p.l.msgObj).filter(Boolean);
  const panelKey = si + ':' + liveMsgs.map((m) => m.name).join(',');
  if (panelKey !== shownStage) { shownStage = panelKey; renderStage(si, liveMsgs); renderClock(si); }
  $('track').querySelector('.fill').style.width = (100 * T / TL.total) + '%';
  if (follow && packets.length) {
    const p = packets[0].g.position;
    controls.target.lerp(new THREE.Vector3(p.x, 1, p.z), 0.08);
    camera.position.lerp(new THREE.Vector3(p.x - 6, 18, p.z + 20), 0.05);
  }
}

// ---- Controls ------------------------------------------------------------------------------
const stageAt = () => { let s = 0; TL.stageStart.forEach((t, i) => { if (t <= T + 1e-6) s = i; }); return s; };
const setPlaying = (v) => { playing = v; $('play').textContent = v ? 'Pause' : 'Play'; };
$('play').onclick = () => { if (!playing && T >= TL.total - 0.01) T = 0; setPlaying(!playing); };
$('next').onclick = () => { const s = stageAt(); T = s + 1 < TL.stages.length ? TL.stageStart[s + 1] : 0; };
$('prev').onclick = () => { const s = stageAt(); T = TL.stageStart[T - TL.stageStart[s] > 1 ? s : Math.max(0, s - 1)]; };
$('speed').onchange = (e) => { speed = +e.target.value; };
$('follow').onclick = () => {
  follow = !follow; $('follow').textContent = follow ? 'Overview' : 'Follow';
  if (!follow) { camera.position.copy(HOME); controls.target.copy(HOME_TARGET); }
};
$('track').onclick = (e) => { const r = $('track').getBoundingClientRect(); T = TL.total * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowRight') $('next').click();
  else if (e.code === 'ArrowLeft') $('prev').click();
  else if (e.code === 'KeyF') $('follow').click();
});

function resize() {
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  // The story panel covers the right on wide screens and the bottom on narrow ones:
  // centre the scene in what is left.
  const wide = innerWidth > 820;
  camera.zoom = Math.min(1, camera.aspect / 1.6 + (wide ? 0.3 : 0.1));
  camera.setViewOffset(innerWidth, innerHeight, wide ? 150 : 0, wide ? 0 : innerHeight * 0.22, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (TL) {
    if (playing) { T += dt * speed; if (T >= TL.total) { T = TL.total; setPlaying(false); } }
    update();
  }
  controls.update();
  renderer.render(scene3, camera);
  labels.render(scene3, camera);
});

// Inline data when built with build_page.py, else trace.json and scene.json beside the page.
const inline = (id) => { const t = $(id).textContent.trim(); return t && !t.startsWith('/*') ? JSON.parse(t) : null; };
const trace = inline('trace-data'), sceneDef = inline('scene-data');
if (trace && sceneDef) build(trace, sceneDef);
else Promise.all(['trace.json', 'scene.json'].map((f) => fetch(f).then((r) => r.json())))
  .then(([t, s]) => build(t, s))
  .catch(() => { $('story').innerHTML = '<p>No data. Run <code>python3 viz/packet-life/build_page.py</code>, or serve this folder over HTTP.</p>'; });
// For automated screenshots: ?t=SECONDS jumps there and pauses.
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null) { T = +qt; setPlaying(false); }
</script>
</body>
